<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f3ee" />
  <title>日常・好好安排</title>
  <style>
    :root{--bg:#f6f3ee;--paper:#fffdf9;--ink:#393c35;--muted:#92958c;--line:#eeece5;--sage:#a8b9a2;--sage-dark:#6d806a;--peach:#e8b5a5;--lav:#c5bad9;--yellow:#e7d49a;--shadow:0 14px 34px rgba(76,74,60,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"Noto Sans TC","PingFang TC",system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:480px;min-height:100vh;margin:auto;background:var(--bg);padding:0 20px 100px;position:relative;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;padding:26px 0 20px}.brand{font-size:14px;color:var(--sage-dark);font-weight:700;letter-spacing:.12em}.brand span{font-size:20px;margin-right:6px}.avatar{width:38px;height:38px;border-radius:50%;background:#e8ddd0;display:grid;place-items:center;font-size:19px}.greeting{font-size:13px;color:var(--muted);margin:4px 0 2px}.heading{font-size:28px;letter-spacing:-.04em;margin:0;font-weight:700}.datebar{display:flex;align-items:center;justify-content:space-between;margin:23px 0 18px}.date-label{font-size:15px;font-weight:700}.date-label small{font-size:12px;color:var(--muted);font-weight:500;margin-left:7px}.date-controls{display:flex;gap:8px}.icon-btn{border:1px solid var(--line);background:var(--paper);color:#6d7169;border-radius:12px;width:34px;height:34px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:22px}.day{height:59px;border:0;background:transparent;border-radius:16px;color:#83877e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.day b{font-size:12px;font-weight:500}.day span{font-size:15px;font-weight:700;color:var(--ink)}.day.active{background:var(--sage-dark);color:white;box-shadow:0 5px 14px #6d806a38}.day.active span{color:white}.day.has:after{content:"";width:4px;height:4px;border-radius:50%;background:var(--peach);position:absolute;transform:translateY(23px)}.day{position:relative}.day.active.has:after{background:#f5d5c8}.summary{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:22px}.summary-card{background:var(--paper);border:1px solid #f0eee7;border-radius:18px;padding:14px 15px;display:flex;align-items:center;gap:11px}.sum-icon{height:36px;width:36px;display:grid;place-items:center;border-radius:13px;background:#edf1e9;font-size:17px}.summary-card:nth-child(2) .sum-icon{background:#f8eee7}.sum-label{font-size:11px;color:var(--muted);margin-bottom:2px}.sum-number{font-size:18px;font-weight:700}.section-head{display:flex;align-items:center;justify-content:space-between;margin:23px 0 12px}.section-head h2{font-size:16px;margin:0}.section-head .sub{font-size:11px;color:var(--muted);margin-left:7px;font-weight:500}.text-btn{border:0;background:transparent;color:var(--sage-dark);font-size:12px;font-weight:700}.deadline{display:flex;align-items:center;gap:12px;background:#fbf2e4;border-radius:16px;padding:13px 14px;margin-bottom:17px}.deadline-icon{width:34px;height:34px;border-radius:12px;background:#f3e3c5;display:grid;place-items:center}.deadline-copy{flex:1}.deadline-copy b{font-size:12px;display:block;margin-bottom:3px}.deadline-copy span{font-size:11px;color:#92876d}.deadline-count{font-size:11px;font-weight:700;color:#9a7950;background:#f6e8ce;padding:6px 9px;border-radius:20px}.timeline{background:var(--paper);border:1px solid #f0eee7;border-radius:20px;padding:7px 15px;box-shadow:var(--shadow)}.event{display:grid;grid-template-columns:52px 3px 1fr;gap:11px;min-height:71px;padding:11px 0;position:relative}.event:not(:last-child):after{content:"";position:absolute;left:63px;top:27px;bottom:-8px;width:1px;background:#efeee8}.time{font-size:11px;color:var(--muted);padding-top:5px}.event-bar{width:3px;border-radius:5px;background:var(--sage);height:100%;min-height:42px;z-index:1}.event-info{padding:3px 0 2px 1px}.event-title{font-weight:700;font-size:13px}.event-meta{color:var(--muted);font-size:11px;margin-top:5px}.event-tag{float:right;font-size:10px;color:#85927f;background:#eff2eb;border-radius:12px;padding:4px 7px;margin-top:-1px}.tasks{background:var(--paper);border:1px solid #f0eee7;border-radius:20px;padding:3px 15px}.task{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid #f0eee7}.task:last-child{border-bottom:0}.check{width:19px;height:19px;border:1.5px solid #d5d8ce;border-radius:7px;background:transparent;display:grid;place-items:center;color:white;flex:none}.task.done .check{background:var(--sage);border-color:var(--sage)}.task.done .task-name{text-decoration:line-through;color:#aaa}.task-name{font-weight:600;font-size:12px}.task-due{font-size:10px;color:#a28b69;margin-top:4px}.task-due.soon{color:#c17f69}.fab{position:fixed;bottom:86px;left:50%;transform:translateX(174px);width:54px;height:54px;border:0;border-radius:19px;background:var(--sage-dark);color:white;font-size:25px;box-shadow:0 8px 20px #6d806a55;z-index:3}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:70px;background:#fffdf9f2;backdrop-filter:blur(10px);border-top:1px solid #eeece5;display:flex;justify-content:space-around;align-items:center;padding-bottom:5px;z-index:2}.nav-item{border:0;background:none;color:#a3a59d;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px}.nav-item span{font-size:18px}.nav-item.active{color:var(--sage-dark);font-weight:700}.toast{position:fixed;bottom:83px;left:50%;transform:translate(-50%,15px);background:#393c35;color:white;padding:10px 15px;border-radius:20px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:8;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    .modal-backdrop{display:none;position:fixed;inset:0;background:#292c2680;z-index:5;align-items:flex-end;justify-content:center}.modal-backdrop.open{display:flex}.modal{background:var(--paper);width:min(480px,100%);border-radius:24px 24px 0 0;padding:20px 22px 30px;max-height:88vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal-head h3{font-size:18px;margin:0}.close{background:#f3f1eb;border:0;border-radius:50%;width:31px;height:31px;font-size:17px;color:#777}.field{margin:13px 0}.field label{display:block;color:#75796f;font-size:11px;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;height:43px;border:1px solid #e9e7df;border-radius:12px;background:#fffefa;padding:0 12px;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#a8b9a2}.row{display:grid;grid-template-columns:1fr 1fr;gap:11px}.seg{display:flex;gap:7px}.seg button{flex:1;border:1px solid #e9e7df;background:white;color:#777;border-radius:11px;padding:9px 4px;font-size:11px}.seg button.selected{background:#edf1e9;border-color:#b8c5b2;color:#53664f;font-weight:700}.color-row{display:flex;gap:10px}.swatch{width:29px;height:29px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #e6e4dd}.swatch.selected{box-shadow:0 0 0 2px var(--sage-dark)}.form-submit{width:100%;border:0;border-radius:13px;background:var(--sage-dark);color:white;padding:13px;font-weight:700;margin-top:9px}.empty{text-align:center;color:var(--muted);padding:25px 8px;font-size:12px}
    @media(min-width:600px){body{padding:20px 0}.app{border-radius:26px;min-height:calc(100vh - 40px);box-shadow:0 20px 60px #42443712}.nav{bottom:20px;border-radius:0 0 26px 26px}.fab{bottom:106px}}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand"><span>☁</span>日常・好好安排</div><div class="avatar" aria-label="個人檔案">🌿</div></header>
  <p class="greeting">早安，今天也慢慢來</p><h1 class="heading">把日子過得剛剛好</h1>
  <div class="datebar"><div class="date-label" id="monthTitle">10月 30日 <small>星期五</small></div><div class="date-controls"><button class="icon-btn" id="prevWeek" aria-label="上一週">‹</button><button class="icon-btn" id="todayBtn" aria-label="回到今天">⌂</button><button class="icon-btn" id="nextWeek" aria-label="下一週">›</button></div></div>
  <div class="week" id="week"></div>
  <div class="summary"><div class="summary-card"><div class="sum-icon">☼</div><div><div class="sum-label">今日行程</div><div class="sum-number" id="eventCount">3 件</div></div></div><div class="summary-card"><div class="sum-icon">♡</div><div><div class="sum-label">待完成</div><div class="sum-number" id="taskCount">3 件</div></div></div></div>
  <div class="section-head"><h2>近期重要期限 <span class="sub">別忘了留一點時間給自己</span></h2><button class="text-btn" id="allTasks">全部 →</button></div>
  <div class="deadline" id="deadline"><div class="deadline-icon">✦</div><div class="deadline-copy"><b>提案初稿繳交</b><span>今天到期・個人待辦</span></div><span class="deadline-count">今天</span></div>
  <div class="section-head"><h2>今天的行程 <span class="sub" id="selectedDateLabel">10/30</span></h2><button class="text-btn" id="addEventTop">＋ 新增</button></div>
  <div class="timeline" id="timeline"></div>
  <div class="section-head"><h2>待辦清單 <span class="sub">不急，逐一完成</span></h2><button class="text-btn" id="addTaskTop">＋ 新增</button></div>
  <div class="tasks" id="tasks"></div>
  <button class="fab" id="fab" aria-label="新增項目">＋</button>
</div>
<nav class="nav"><button class="nav-item active" data-page="首頁"><span>⌂</span>首頁</button><button class="nav-item" data-page="行程"><span>▦</span>行程</button><button class="nav-item" data-page="待辦"><span>☑</span>待辦</button><button class="nav-item" data-page="我的"><span>☺</span>我的</button></nav>
<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h3 id="modalTitle">新增行程</h3><button class="close" id="closeModal" aria-label="關閉">×</button></div><div id="formMount"></div></div></div>
<script>
(()=>{
 const palette=[{name:'鼠尾草綠',hex:'#a8b9a2'},{name:'暖桃粉',hex:'#e8b5a5'},{name:'柔霧紫',hex:'#c5bad9'},{name:'奶油黃',hex:'#e7d49a'},{name:'天空藍',hex:'#a9c7d2'}];
 const events=[
  {title:'晨間伸展與閱讀',date:'2026-10-30',start:'08:00',end:'08:45',repeat:'每週',color:'#a8b9a2',place:'在家・留給自己的時光'},
  {title:'團隊週會',date:'2026-10-30',start:'10:00',end:'11:00',repeat:'每週',color:'#c5bad9',place:'線上會議'},
  {title:'午餐與散步',date:'2026-10-30',start:'12:30',end:'13:30',repeat:'單次',color:'#e8b5a5',place:'附近公園'},
  {title:'瑜伽課',date:'2026-11-02',start:'18:30',end:'19:30',repeat:'每週',color:'#e7d49a',place:'日光瑜伽教室'}
 ];
 const tasks=[{title:'提案初稿繳交',due:'2026-10-30',time:'15:00',allDay:false,done:false},{title:'購買週末野餐食材',due:'2026-10-31',time:null,allDay:true,done:false},{title:'整理本月收支',due:'2026-11-03',time:'18:00',allDay:false,done:false},{title:'預約牙醫洗牙',due:'2026-11-06',time:null,allDay:true,done:true}];
 let selected=new Date(2026,9,30); const base=new Date(2026,9,30); let selectedColor=palette[0].hex;
 const fmtDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
 const parseDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
 const sameDate=(a,b)=>fmtDate(a)===fmtDate(b);
 const monthNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
 const weekdays=['日','一','二','三','四','五','六'];
 const toast=(s)=>{const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2100)};
 function renderWeek(){const start=new Date(selected);start.setDate(start.getDate()-((start.getDay()+6)%7));const el=document.getElementById('week');el.innerHTML='';for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const btn=document.createElement('button');btn.className='day'+(sameDate(d,selected)?' active':'')+(events.some(e=>e.date===fmtDate(d))?' has':'');btn.innerHTML=`<b>${weekdays[d.getDay()]}</b><span>${d.getDate()}</span>`;btn.onclick=()=>{selected=d;render()};el.appendChild(btn)} document.getElementById('monthTitle').innerHTML=`${monthNames[selected.getMonth()]} ${selected.getDate()}日 <small>星期${weekdays[selected.getDay()]}</small>`;document.getElementById('selectedDateLabel').textContent=`${selected.getMonth()+1}/${selected.getDate()}`;}
 function renderEvents(){const list=events.filter(e=>e.date===fmtDate(selected)).sort((a,b)=>a.start.localeCompare(b.start));document.getElementById('eventCount').textContent=`${list.length} 件`;const wrap=document.getElementById('timeline');wrap.innerHTML=list.length?'':'<div class="empty">今天沒有安排，留白也很好 🌱</div>';list.forEach(e=>{const row=document.createElement('div');row.className='event';row.innerHTML=`<div class="time">${e.start}</div><div class="event-bar" style="background:${e.color}"></div><div class="event-info"><span class="event-tag">${e.repeat==='單次'?'單次':e.repeat}</span><div class="event-title">${escapeHtml(e.title)}</div><div class="event-meta">${e.start} – ${e.end}　·　${escapeHtml(e.place||'')}</div></div>`;wrap.appendChild(row)})}
 function renderTasks(){const open=tasks.filter(t=>!t.done).length;document.getElementById('taskCount').textContent=`${open} 件`;const wrap=document.getElementById('tasks');wrap.innerHTML='';const sorted=[...tasks].sort((a,b)=>Number(a.done)-Number(b.done)||a.due.localeCompare(b.due));if(!sorted.length)wrap.innerHTML='<div class="empty">目前沒有待辦，享受片刻寧靜 ✨</div>';sorted.forEach((t)=>{const index=tasks.indexOf(t),d=parseDate(t.due),delta=Math.round((d-new Date(selected.getFullYear(),selected.getMonth(),selected.getDate()))/86400000);const dueLabel=delta<0?`逾期 ${Math.abs(delta)} 天`:delta===0?'今天到期':delta===1?'明天到期':`${d.getMonth()+1}/${d.getDate()} 到期`;const row=document.createElement('div');row.className='task'+(t.done?' done':'');row.innerHTML=`<button class="check" aria-label="${t.done?'標記未完成':'完成待辦'}">${t.done?'✓':''}</button><div><div class="task-name">${escapeHtml(t.title)}</div><div class="task-due ${delta<=1&&!t.done?'soon':''}">>${dueLabel}${t.allDay?'・全天':t.time?'・'+t.time:''}</div></div>`;row.querySelector('.check').onclick=()=>{tasks[index].done=!tasks[index].done;renderTasks();renderDeadline()};wrap.appendChild(row)});}
 function renderDeadline(){const upcoming=tasks.filter(t=>!t.done).sort((a,b)=>a.due.localeCompare(b.due))[0],el=document.getElementById('deadline');if(!upcoming){el.innerHTML='<div class="deadline-icon">✧</div><div class="deadline-copy"><b>暫無待辦期限</b><span>好好享受目前的步調</span></div>';return}const d=parseDate(upcoming.due),delta=Math.round((d-new Date(selected.getFullYear(),selected.getMonth(),selected.getDate()))/86400000);let label=delta<0?`已逾期 ${Math.abs(delta)} 天`:delta===0?'今天到期':delta===1?'明天到期':`${d.getMonth()+1}/${d.getDate()} 到期`;let pill=delta<0?'留意':delta===0?'今天':delta===1?'明天':`${delta}天後`;el.innerHTML=`<div class="deadline-icon">✦</div><div class="deadline-copy"><b>${escapeHtml(upcoming.title)}</b><span>${label}・個人待辦</span></div><span class="deadline-count">${pill}</span>`}
 function render(){renderWeek();renderEvents();renderTasks();renderDeadline()}
 function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 const backdrop=document.getElementById('modalBackdrop'),mount=document.getElementById('formMount');function closeModal(){backdrop.classList.remove('open')}
 function openForm(type){const isEvent=type==='event';document.getElementById('modalTitle').textContent=isEvent?'新增行程':'新增待辦';selectedColor=palette[0].hex;mount.innerHTML=isEvent?`
  <form id="itemForm"><div class="field"><label>行程名稱</label><input name="title" placeholder="例如：晚間瑜伽" required maxlength="40" /></div><div class="field"><label>日期</label><input name="date" type="date" value="${fmtDate(selected)}" required /></div><div class="row"><div class="field"><label>開始時間</label><input name="start" type="time" value="09:00" required /></div><div class="field"><label>結束時間</label><input name="end" type="time" value="10:00" required /></div></div><div class="field"><label>重複頻率</label><div class="seg" id="repeatSeg"><button type="button" class="selected" data-v="單次">單次</button><button type="button" data-v="每週">每週</button><button type="button" data-v="每月">每月</button></div></div><div class="field"><label>行程顏色</label><div class="color-row">${palette.map((p,i)=>`<button type="button" aria-label="${p.name}" title="${p.name}" class="swatch ${i===0?'selected':''}" data-color="${p.hex}" style="background:${p.hex}"></button>`).join('')}</div></div><div class="field"><label>地點或備註（選填）</label><input name="place" placeholder="例如：家裡、咖啡廳" maxlength="60" /></div><button class="form-submit">儲存行程</button></form>`:`<form id="itemForm"><div class="field"><label>待辦事項</label><input name="title" placeholder="例如：整理旅行清單" required maxlength="60" /></div><div class="field"><label>期限日期</label><input name="date" type="date" value="${fmtDate(selected)}" required /></div><div class="field"><label>時間</label><div class="seg" id="taskTimeMode"><button type="button" class="selected" data-mode="time">選擇時間</button><button type="button" data-mode="allDay">全天</button></div></div><div class="field" id="taskTimeField"><input name="time" type="time" value="09:00" aria-label="選擇待辦時間" required /></div><button class="form-submit">新增待辦</button></form>`;
  let repeat='單次',taskAllDay=false;document.querySelectorAll('#taskTimeMode button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#taskTimeMode button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');taskAllDay=b.dataset.mode==='allDay';const timeField=document.getElementById('taskTimeField');timeField.style.display=taskAllDay?'none':'block';timeField.querySelector('input').required=!taskAllDay});document.querySelectorAll('#repeatSeg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#repeatSeg button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');repeat=b.dataset.v});document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selectedColor=b.dataset.color});document.getElementById('itemForm').onsubmit=e=>{e.preventDefault();const data=new FormData(e.target),title=data.get('title').trim();if(isEvent){const date=data.get('date');if(data.get('end')<=data.get('start')){toast('結束時間要晚於開始時間');return}events.push({title,date,start:data.get('start'),end:data.get('end'),repeat,color:selectedColor,place:data.get('place').trim()});selected=parseDate(date);toast('行程已加入，好好安排 🌿')}else{tasks.push({title,due:data.get('date'),time:taskAllDay?null:data.get('time'),allDay:taskAllDay,done:false});toast('待辦已記下，慢慢完成就好 ♡')}render();closeModal()};backdrop.classList.add('open')}
 document.getElementById('closeModal').onclick=closeModal;backdrop.onclick=e=>{if(e.target===backdrop)closeModal()};document.getElementById('fab').onclick=()=>openForm('event');document.getElementById('addEventTop').onclick=()=>openForm('event');document.getElementById('addTaskTop').onclick=()=>openForm('task');document.getElementById('allTasks').onclick=()=>{document.getElementById('tasks').scrollIntoView({behavior:'smooth'});toast('這裡是你的待辦清單')};document.getElementById('prevWeek').onclick=()=>{selected.setDate(selected.getDate()-7);render()};document.getElementById('nextWeek').onclick=()=>{selected.setDate(selected.getDate()+7);render()};document.getElementById('todayBtn').onclick=()=>{selected=new Date(base);render()};document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.page==='行程'){document.getElementById('timeline').scrollIntoView({behavior:'smooth'});toast('查看行程')}else if(b.dataset.page==='待辦'){document.getElementById('tasks').scrollIntoView({behavior:'smooth'});toast('查看待辦')}else if(b.dataset.page==='我的')toast('個人設定即將推出');else window.scrollTo({top:0,behavior:'smooth'})});
 render();
})();
</script>
</body>
</html>
