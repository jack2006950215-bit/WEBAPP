<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f3ee" />
  <title>日常・好好安排</title>
  <style>
    :root{--bg:#f6f3ee;--paper:#fffdf9;--ink:#393c35;--muted:#92958c;--line:#eeece5;--sage:#a8b9a2;--sage-dark:#6d806a;--peach:#e8b5a5;--lav:#c5bad9;--yellow:#e7d49a;--shadow:0 14px 34px rgba(76,74,60,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"Noto Sans TC","PingFang TC",system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer}.app{width:min(100%,1200px);min-height:100vh;margin:auto;background:var(--bg);padding:0 clamp(16px,4vw,48px) 100px;position:relative;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;padding:26px 0 20px}.brand{font-size:14px;color:var(--sage-dark);font-weight:700;letter-spacing:.12em}.brand span{font-size:20px;margin-right:6px}.avatar{width:38px;height:38px;border-radius:50%;background:#e8ddd0;display:grid;place-items:center;font-size:19px}.greeting{font-size:13px;color:var(--muted);margin:4px 0 2px}.heading{font-size:28px;letter-spacing:-.04em;margin:0;font-weight:700}.datebar{display:flex;align-items:center;justify-content:space-between;margin:23px 0 18px}.date-label{font-size:15px;font-weight:700}.date-label small{font-size:12px;color:var(--muted);font-weight:500;margin-left:7px}.date-controls{display:flex;gap:8px}.icon-btn{border:1px solid var(--line);background:var(--paper);color:#6d7169;border-radius:12px;width:34px;height:34px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:22px}.day{height:59px;border:0;background:transparent;border-radius:16px;color:#83877e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.day b{font-size:12px;font-weight:500}.day span{font-size:15px;font-weight:700;color:var(--ink)}.day.active{background:var(--sage-dark);color:white;box-shadow:0 5px 14px #6d806a38}.day.active span{color:white}.day.has:after{content:"";width:4px;height:4px;border-radius:50%;background:var(--peach);position:absolute;transform:translateY(23px)}.day{position:relative}.day.active.has:after{background:#f5d5c8}.summary{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:22px}.summary-card{background:var(--paper);border:1px solid #f0eee7;border-radius:18px;padding:14px 15px;display:flex;align-items:center;gap:11px}.sum-icon{height:36px;width:36px;display:grid;place-items:center;border-radius:13px;background:#edf1e9;font-size:17px}.summary-card:nth-child(2) .sum-icon{background:#f8eee7}.sum-label{font-size:11px;color:var(--muted);margin-bottom:2px}.sum-number{font-size:18px;font-weight:700}.section-head{display:flex;align-items:center;justify-content:space-between;margin:23px 0 12px}.section-head h2{font-size:16px;margin:0}.section-head .sub{font-size:11px;color:var(--muted);margin-left:7px;font-weight:500}.text-btn{border:0;background:transparent;color:var(--sage-dark);font-size:12px;font-weight:700}.deadline{display:flex;align-items:center;gap:12px;background:#fbf2e4;border-radius:16px;padding:13px 14px;margin-bottom:17px}.deadline-icon{width:34px;height:34px;border-radius:12px;background:#f3e3c5;display:grid;place-items:center}.deadline-copy{flex:1}.deadline-copy b{font-size:12px;display:block;margin-bottom:3px}.deadline-copy span{font-size:11px;color:#92876d}.deadline-count{font-size:11px;font-weight:700;color:#9a7950;background:#f6e8ce;padding:6px 9px;border-radius:20px}.timeline{background:var(--paper);border:1px solid #f0eee7;border-radius:20px;padding:7px 15px;box-shadow:var(--shadow)}.event{display:grid;grid-template-columns:52px 3px 1fr;gap:11px;min-height:71px;padding:11px 0;position:relative}.event:not(:last-child):after{content:"";position:absolute;left:63px;top:27px;bottom:-8px;width:1px;background:#efeee8}.time{font-size:11px;color:var(--muted);padding-top:5px}.event-bar{width:3px;border-radius:5px;background:var(--sage);height:100%;min-height:42px;z-index:1}.event-info{padding:3px 0 2px 1px}.event-title{font-weight:700;font-size:13px}.event-meta{color:var(--muted);font-size:11px;margin-top:5px}.event-tag{float:right;font-size:10px;color:#85927f;background:#eff2eb;border-radius:12px;padding:4px 7px;margin-top:-1px}.tasks{background:var(--paper);border:1px solid #f0eee7;border-radius:20px;padding:3px 15px}.task{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid #f0eee7}.task:last-child{border-bottom:0}.check{width:19px;height:19px;border:1.5px solid #d5d8ce;border-radius:7px;background:transparent;display:grid;place-items:center;color:white;flex:none}.task.done .check{background:var(--sage);border-color:var(--sage)}.task.done .task-name{text-decoration:line-through;color:#aaa}.task-name{font-weight:600;font-size:12px}.task-due{font-size:10px;color:#a28b69;margin-top:4px}.task-due.soon{color:#c17f69}.fab{position:fixed;bottom:86px;left:calc(50% + min(600px, 50vw) - 76px);transform:none;width:54px;height:54px;border:0;border-radius:19px;background:var(--sage-dark);color:white;font-size:25px;box-shadow:0 8px 20px #6d806a55;z-index:3}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(1200px,100%);height:70px;background:#fffdf9f2;backdrop-filter:blur(10px);border-top:1px solid #eeece5;display:flex;justify-content:space-around;align-items:center;padding-bottom:5px;z-index:2}.nav-item{border:0;background:none;color:#a3a59d;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px}.nav-item span{font-size:18px}.nav-item.active{color:var(--sage-dark);font-weight:700}.toast{position:fixed;bottom:83px;left:50%;transform:translate(-50%,15px);background:#393c35;color:white;padding:10px 15px;border-radius:20px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:8;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    .modal-backdrop{display:none;position:fixed;inset:0;background:#292c2680;z-index:5;align-items:flex-end;justify-content:center}.modal-backdrop.open{display:flex}.modal{background:var(--paper);width:min(560px,100%);border-radius:24px 24px 0 0;padding:20px 22px 30px;max-height:88vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal-head h3{font-size:18px;margin:0}.close{background:#f3f1eb;border:0;border-radius:50%;width:31px;height:31px;font-size:17px;color:#777}.field{margin:13px 0}.field label{display:block;color:#75796f;font-size:11px;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;height:43px;border:1px solid #e9e7df;border-radius:12px;background:#fffefa;padding:0 12px;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#a8b9a2}.row{display:grid;grid-template-columns:1fr 1fr;gap:11px}.seg{display:flex;gap:7px}.seg button{flex:1;border:1px solid #e9e7df;background:white;color:#777;border-radius:11px;padding:9px 4px;font-size:11px}.seg button.selected{background:#edf1e9;border-color:#b8c5b2;color:#53664f;font-weight:700}.color-row{display:flex;gap:10px}.swatch{width:29px;height:29px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #e6e4dd}.swatch.selected{box-shadow:0 0 0 2px var(--sage-dark)}.form-submit{width:100%;border:0;border-radius:13px;background:var(--sage-dark);color:white;padding:13px;font-weight:700;margin-top:9px}.empty{text-align:center;color:var(--muted);padding:25px 8px;font-size:12px}
    @media(min-width:760px){
      body{padding:24px 0 100px}
      .app{min-height:calc(100vh - 124px);border-radius:28px;padding:0 clamp(28px,5vw,64px) 48px;box-shadow:0 20px 60px #42443712}
      .top{padding-top:32px}
      .heading{font-size:clamp(30px,3vw,40px)}
      .summary{max-width:760px}
      .deadline,.timeline,.tasks{max-width:900px}
      .week{max-width:760px}
      .nav{bottom:20px;width:min(1200px,calc(100% - 48px));border-radius:0 0 28px 28px}
      .fab{bottom:106px;left:calc(50% + min(600px, (100vw - 48px)/2) - 84px)}
      .modal-backdrop{align-items:center;padding:24px}
      .modal{border-radius:24px;box-shadow:0 24px 80px #292c2633}
    }
    @media(max-width:380px){
      .app{padding-left:14px;padding-right:14px}
      .section-head .sub{display:none}
      .summary-card{padding:12px 10px;gap:8px}
      .event{grid-template-columns:44px 3px minmax(0,1fr);gap:9px}
      .event:not(:last-child):after{left:53px}
      .event-tag{font-size:9px}
    }

    .focus-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 22px;align-items:center;background:linear-gradient(135deg,#edf1e9,#f8f3e9);border:1px solid #e5e9df;border-radius:22px;padding:20px;margin:20px 0 26px;max-width:900px}.focus-kicker{font-size:11px;color:var(--sage-dark);font-weight:700}.focus-copy h2{margin:5px 0;font-size:18px}.focus-copy p{margin:0;color:var(--muted);font-size:12px}.timer-display{font-variant-numeric:tabular-nums;font-size:36px;letter-spacing:.03em;font-weight:750;color:var(--sage-dark)}.timer-presets{display:flex;gap:7px}.timer-preset,.timer-secondary{border:1px solid #e1e5db;background:#fffdf9;color:#687464;border-radius:11px;padding:8px 12px;font-size:11px}.timer-preset.selected{background:#6d806a;color:white;border-color:#6d806a}.timer-actions{display:flex;gap:8px;justify-content:flex-end}.timer-start{background:var(--sage-dark);color:#fff;border:0;border-radius:11px;padding:9px 18px;font-size:12px;font-weight:700}.urge-button{grid-column:1/-1;border:1px solid #edd8cd;background:#fff9f5;color:#a56f5c;border-radius:13px;padding:11px;font-weight:700;font-size:12px}.task{align-items:flex-start}.task-body{flex:1;min-width:0}.task-next{background:#f5f5ef;border-radius:10px;padding:9px 10px;margin-top:9px;color:#66745f;font-size:11px;line-height:1.5}.task-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}.task-step-btn,.task-details summary{border:0;background:none;color:var(--sage-dark);font-size:11px;font-weight:700;padding:4px 0;cursor:pointer}.task-details{margin-top:4px}.task-details ol{margin:5px 0 8px;padding-left:22px;color:#75796f;font-size:11px;line-height:1.8}.task-details li.current-step{color:var(--sage-dark);font-weight:700}.microstep-list{display:grid;gap:8px;margin:10px 0}.microstep{display:flex;align-items:flex-start;gap:8px;color:#66745f;font-size:11px;line-height:1.5}.microstep input{margin:2px 0 0;accent-color:var(--sage-dark)}.task-reset{border:0;background:none;color:#a17968;font-size:11px;font-weight:700;padding:4px 0;cursor:pointer}.urge-backdrop{display:none;position:fixed;inset:0;background:#292c2680;z-index:9;align-items:center;justify-content:center;padding:18px}.urge-backdrop.open{display:flex}.urge-modal{position:relative;width:min(460px,100%);background:var(--paper);border-radius:24px;padding:28px 24px 22px;box-shadow:0 24px 80px #292c2633;text-align:center}.urge-modal .close{position:absolute;right:15px;top:14px}.urge-emoji{font-size:28px}.urge-modal h2{font-size:20px;margin:10px 0}.urge-modal p{color:var(--muted);font-size:12px;line-height:1.7}.urge-reasons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.urge-reasons button{border:1px solid #e9e7df;background:#fffefa;border-radius:12px;padding:10px 6px;color:#777;font-size:11px}.urge-reasons button.selected{border-color:#a8b9a2;background:#edf1e9;color:#53664f;font-weight:700}.urge-actions{display:grid;gap:8px}.urge-actions .form-submit{margin:0}.urge-actions .timer-secondary{padding:12px}.urge-note{font-size:10px!important}.task-plan-preview{background:#f5f5ef;padding:8px 12px;border-radius:12px;color:#66745f;font-size:11px;line-height:1.7}.task-plan-preview ol{margin:4px 0;padding-left:20px}.field-hint{font-size:10px;color:var(--muted);margin-top:6px}.tasks-empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:12px}
    @media(max-width:540px){.focus-card{grid-template-columns:1fr auto;padding:16px;gap:10px}.timer-display{font-size:30px}.timer-presets,.timer-actions{grid-column:1/-1;justify-content:flex-start}.urge-modal{padding:25px 17px 18px}}

    .auth-controls{display:flex;align-items:center;gap:8px;min-width:0}.google-login{height:38px;padding:0 11px;border:1px solid var(--line);border-radius:13px;background:var(--paper);color:var(--ink);display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;white-space:nowrap}.google-login:disabled{opacity:.65;cursor:not-allowed}.google-mark{width:19px;height:19px;border-radius:50%;background:white;display:grid;place-items:center;color:#4285f4;font-size:13px;font-weight:800;box-shadow:0 0 0 1px #eee}.signed-in-profile{display:flex;align-items:center;gap:7px;min-width:0}.auth-photo{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#e8ddd0}.auth-name{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:700}.signout-btn{border:0;background:transparent;color:var(--sage-dark);font-size:11px;font-weight:700;padding:7px 0 7px 5px}.auth-status{margin:-11px 0 13px;color:#9b725d;font-size:11px;line-height:1.45}.auth-status[hidden],[hidden]{display:none!important}
    .event-row-top{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-bottom:3px}.event-tag{float:none;margin:0}.event-delete{border:0;border-radius:10px;background:#fbefeb;color:#a56f5c;font-size:10px;font-weight:700;padding:4px 8px}.section-actions{display:flex;align-items:center;gap:10px}.event-trash-toggle{display:flex;align-items:center;gap:5px}.event-trash-count{min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:#f3eee5;color:#85765f;font-size:10px;line-height:17px;text-align:center}.trash-event{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0eee7}.trash-event:last-child{border-bottom:0}.trash-event-copy{flex:1;min-width:0}.trash-event-title{font-size:12px;font-weight:700}.trash-event-meta{font-size:10px;color:var(--muted);margin-top:4px}.event-restore{border:1px solid #dfe8dc;border-radius:10px;background:#f1f5ef;color:var(--sage-dark);font-size:11px;font-weight:700;padding:7px 10px;white-space:nowrap}.trash-empty{text-align:center;color:var(--muted);padding:18px 8px;font-size:12px}.completed-section{scroll-margin-top:14px;scroll-margin-bottom:100px}.completed-section h2:focus{outline:2px solid #a8b9a2;outline-offset:4px;border-radius:4px}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand"><span>☁</span>日常・好好安排</div><div class="auth-controls"><button class="google-login" id="googleSignIn" type="button"><span class="google-mark" aria-hidden="true">G</span><span>Google 登入</span></button><div class="signed-in-profile" id="signedInProfile" hidden><img class="auth-photo" id="authPhoto" alt="" hidden /><span class="auth-name" id="authName"></span><button class="signout-btn" id="googleSignOut" type="button">登出</button></div></div></header>
  <p class="auth-status" id="authStatus" role="status" aria-live="polite" hidden></p>
  <p class="greeting">早安，今天也慢慢來</p><h1 class="heading">把日子過得剛剛好</h1>
  <div class="datebar"><div class="date-label" id="monthTitle">10月 30日 <small>星期五</small></div><div class="date-controls"><button class="icon-btn" id="prevWeek" aria-label="上一週">‹</button><button class="icon-btn" id="todayBtn" aria-label="回到今天">⌂</button><button class="icon-btn" id="nextWeek" aria-label="下一週">›</button></div></div>
  <div class="week" id="week"></div>
  <div class="summary"><div class="summary-card"><div class="sum-icon">☼</div><div><div class="sum-label">今日行程</div><div class="sum-number" id="eventCount">3 件</div></div></div><div class="summary-card"><div class="sum-icon">♡</div><div><div class="sum-label">待完成</div><div class="sum-number" id="taskCount">3 件</div></div></div></div>
  <section class="focus-card" aria-label="短專注計時器"><div class="focus-copy"><span class="focus-kicker">給自己一小段安靜時間</span><h2>先專心一小步</h2><p id="focusStatus">不用一次做很多，先開始就很好。</p></div><div class="timer-display" id="timerDisplay" role="timer" aria-live="polite">15:00</div><div class="timer-presets"><button class="timer-preset" data-minutes="10">10 分鐘</button><button class="timer-preset selected" data-minutes="15">15 分鐘</button><button class="timer-preset" data-minutes="25">25 分鐘</button></div><div class="timer-actions"><button class="timer-start" id="timerStart">開始專注</button><button class="timer-secondary" id="timerReset">重新計時</button></div><button class="urge-button" id="urgeButton">📱　我想滑手機，先停一下</button></section>
  <div class="section-head"><h2>近期重要期限 <span class="sub">別忘了留一點時間給自己</span></h2><button class="text-btn" id="allTasks">全部 →</button></div>
  <div class="deadline" id="deadline"><div class="deadline-icon">✦</div><div class="deadline-copy"><b>提案初稿繳交</b><span>今天到期・個人待辦</span></div><span class="deadline-count">今天</span></div>
  <div class="section-head"><h2>今天的行程 <span class="sub" id="selectedDateLabel">10/30</span></h2><div class="section-actions"><button class="text-btn event-trash-toggle" id="eventTrashToggle" type="button" aria-expanded="false" aria-controls="eventTrashPanel">🗑 垃圾桶 <span class="event-trash-count" id="eventTrashCount">0</span></button><button class="text-btn" id="addEventTop">＋ 新增</button></div></div>
  <div class="timeline" id="timeline"></div>
  <div class="tasks" id="eventTrashPanel" hidden><div id="deletedEvents"></div></div>
  <div class="section-head"><h2 id="tasksHeading">今天待辦 <span class="sub">不急，逐一完成</span></h2><button class="text-btn" id="addTaskTop">＋ 新增</button></div>
  <div class="tasks" id="tasks"></div>
  <section class="completed-section" id="completedTasksSection" aria-labelledby="completedTasksHeading"><div class="section-head"><h2 id="completedTasksHeading" tabindex="-1">已完成任務區</h2><span id="completedTaskCount" class="sub"></span></div><div class="tasks" id="completedTasks"></div></section>
  <button class="fab" id="fab" aria-label="新增項目">＋</button>
</div>
<nav class="nav"><button class="nav-item active" data-page="首頁"><span>⌂</span>首頁</button><button class="nav-item" data-page="行程"><span>▦</span>行程</button><button class="nav-item" data-page="待辦"><span>☑</span>待辦</button><button class="nav-item" data-page="我的"><span>☺</span>我的</button></nav>
<div class="toast" id="toast"></div>
<div class="urge-backdrop" id="urgeBackdrop" aria-hidden="true"><section class="urge-modal" role="dialog" aria-modal="true" aria-labelledby="urgeTitle"><button class="close" id="urgeClose" aria-label="關閉">×</button><div class="urge-emoji">🌿</div><h2 id="urgeTitle">先停一下，你不用責怪自己</h2><p>把手機放到手拿不到的地方，慢慢吸氣、吐氣三次。現在最像哪一種感覺？</p><div class="urge-reasons"><button data-reason="有點焦慮">有點焦慮</button><button data-reason="不知道從哪開始">不知道從哪開始</button><button data-reason="只是習慣打開">只是習慣打開</button><button data-reason="我需要休息">我需要休息</button></div><div class="urge-actions"><button class="form-submit" id="urgeStudy">從下一小步開始 10 分鐘</button><button class="timer-secondary" id="urgeRest">先休息 3 分鐘</button></div><p class="urge-note" id="urgeNote">這個頁面不能鎖住其他 App；可搭配手機內建的專注模式或使用時間限制。</p></section></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h3 id="modalTitle">新增行程</h3><button class="close" id="closeModal" aria-label="關閉">×</button></div><div id="formMount"></div></div></div>
<script>
(()=>{
 const palette=[{name:'鼠尾草綠',hex:'#a8b9a2'},{name:'暖桃粉',hex:'#e8b5a5'},{name:'柔霧紫',hex:'#c5bad9'},{name:'奶油黃',hex:'#e7d49a'},{name:'天空藍',hex:'#a9c7d2'}];
 const localToday=new Date(); localToday.setHours(0,0,0,0);
 const todayKey=localToday.getFullYear()+'-'+String(localToday.getMonth()+1).padStart(2,'0')+'-'+String(localToday.getDate()).padStart(2,'0');
 const tomorrowKey=(()=>{const d=new Date(localToday);d.setDate(d.getDate()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})();
 const events=[
  {title:'晨間伸展與閱讀',date:todayKey,start:'08:00',end:'08:45',repeat:'每週',color:'#a8b9a2',place:'在家・留給自己的時光'},

   row.innerHTML='<button class="check" aria-label="'+(t.done?'標記未完成':'完成待辦')+'">'+(t.done?'✓':'')+'</button><div class="task-body"><div class="task-name">'+escapeHtml(t.title)+'</div><div class="task-due">'+dueLabel+due+'</div>'+(t.done?'<div class="task-next">這項任務已完成，做得很好 🌱</div>':(hasSteps?'<div class="task-next"><b>現在只做這一步：</b> '+(nextIndex>=0?escapeHtml(t.steps[nextIndex].text):'全部小步驟都完成了')+'</div>':'') )+subtaskHtml+(t.done?'':'<div class="task-tools"><button class="task-reset" data-reset>'+(hasSteps?'重置小步驟':'重置任務')+'</button></div>')+'</div>';
   row.querySelector('.check').onclick=()=>{const done=!tasks[i].done;tasks[i].done=done;if(tasks[i].split)tasks[i].steps.forEach(step=>step.done=done);savePlanner();render();focusTaskArea(done)};
   row.querySelectorAll('[data-step]').forEach(box=>box.onchange=()=>{tasks[i].steps[Number(box.dataset.step)].done=box.checked;tasks[i].done=tasks[i].steps.length>0&&tasks[i].steps.every(step=>step.done);const done=tasks[i].done;savePlanner();render();if(done)focusTaskArea(true)});
   const reset=row.querySelector('[data-reset]');if(reset)reset.onclick=()=>{tasks[i].steps.forEach(step=>step.done=false);tasks[i].done=false;savePlanner();render();toast('小步驟已重置，可以重新開始 🌱')};target.appendChild(row)
  };
  list.forEach(t=>renderTaskRow(t,wrap));completed.forEach(t=>renderTaskRow(t,completedWrap));
 }
 renderTasks=renderStudyTasks;
 document.getElementById('tasksHeading').innerHTML=(fmtDate(selected)===todayKey?'今天':(selected.getMonth()+1)+'/'+selected.getDate())+'待辦 <span class="sub">不急，逐一完成</span>';
 document.getElementById('week').addEventListener('click',()=>{setTimeout(()=>{document.getElementById('tasksHeading').innerHTML=(fmtDate(selected)===todayKey?'今天':(selected.getMonth()+1)+'/'+selected.getDate())+'待辦 <span class="sub">不急，逐一完成</span>'},0)});
 document.addEventListener('click',e=>{if(e.target&&e.target.id==='addTaskTop'){setTimeout(()=>{const input=document.getElementById('itemForm')?.querySelector('[name="title"]');if(input){const preview=document.getElementById('taskPlanPreview');const update=()=>{preview.innerHTML='<ol>'+makeSteps(input.value.trim()||'讀書任務').map(x=>'<li>'+escapeHtml(x)+'</li>').join('')+'</ol>'};input.addEventListener('input',update);update()}},0)}});
 document.addEventListener('click',e=>{if(e.target&&e.target.id==='fab'){setTimeout(()=>{const form=document.getElementById('itemForm');if(form&&!form.querySelector('[name="start"]'))closeModal();else if(form){/* fab keeps its original quick-add event behavior */}},0)}});
 let selectedMinutes=15,remaining=900,endAt=null,interval=null;const display=document.getElementById('timerDisplay'),startBtn=document.getElementById('timerStart'),focusStatus=document.getElementById('focusStatus');
 function timerPaint(){if(endAt){remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));if(!remaining){endAt=null;clearInterval(interval);interval=null;focusStatus.textContent='這一小段完成了，喝口水、伸展一下 🌱';toast('專注時間完成，做得很好！')}}display.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');startBtn.textContent=endAt?'暫停':'開始專注'}
 function beginTimer(mins){if(endAt){remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));endAt=null;clearInterval(interval);interval=null;focusStatus.textContent='已暫停，準備好時再繼續。';timerPaint();return}if(mins!==null){remaining=mins*60;if(mins!==3)selectedMinutes=mins}endAt=Date.now()+remaining*1000;focusStatus.textContent='現在只要專心眼前這一小步。';clearInterval(interval);interval=setInterval(timerPaint,250);timerPaint()}
 function resetTimer(){endAt=null;clearInterval(interval);interval=null;remaining=selectedMinutes*60;focusStatus.textContent='不用一次做很多，先開始就很好。';timerPaint()}
 document.querySelectorAll('.timer-preset').forEach(b=>b.onclick=()=>{if(endAt)return;document.querySelectorAll('.timer-preset').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selectedMinutes=Number(b.dataset.minutes);resetTimer()});startBtn.onclick=()=>beginTimer(endAt?null:(remaining<=0?selectedMinutes:null));document.getElementById('timerReset').onclick=resetTimer;
 const urge=document.getElementById('urgeBackdrop');function closeUrge(){urge.classList.remove('open');urge.setAttribute('aria-hidden','true')}
 document.getElementById('urgeButton').onclick=()=>{urge.classList.add('open');urge.setAttribute('aria-hidden','false')};document.getElementById('urgeClose').onclick=closeUrge;urge.onclick=e=>{if(e.target===urge)closeUrge()};document.querySelectorAll('.urge-reasons button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.urge-reasons button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('urgeNote').textContent=b.dataset.reason==='我需要休息'?'休息也是照顧自己；設好時間，時間到再決定下一步。':'謝謝你注意到自己的狀態。先不用解決全部，只做一個很小的選擇。'});
 document.getElementById('urgeStudy').onclick=()=>{const t=tasks.find(x=>x.due===fmtDate(selected)&&!x.done);if(t&&t.split&&t.steps.length){const next=t.steps.find(step=>!step.done);if(next)focusStatus.textContent='現在只做：'+next.text};closeUrge();document.querySelectorAll('.timer-preset').forEach(x=>x.classList.remove('selected'));document.querySelector('.timer-preset[data-minutes="10"]').classList.add('selected');beginTimer(10)};
 document.getElementById('urgeRest').onclick=()=>{closeUrge();focusStatus.textContent='先安心休息，時間到再決定要不要開始。';beginTimer(3)};

 render();
})();
